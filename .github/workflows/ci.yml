name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx ruff@0.16.7 check --select E,F --ignore E501 src tests
      - run: uvx ruff@0.16.7 format --check src tests

  # The locked, newest dependencies on every supported Python.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked pytest -q

  # The oldest dependency versions pyproject.toml admits, on the oldest Python.
  # A floor that no longer installs or passes is a floor that is not true.
  floors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync --resolution lowest-direct
      - run: uv run --no-sync pytest -q

  # What a release would carry. The sdist is built from a checkout, so anything
  # it holds that the commit does not is a file the build invented.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --out-dir dist
      - name: Every packaged file is tracked in this commit
        run: |
          tar tzf dist/*.tar.gz \
            | sed -e 's|^witnessed-[^/]*/||' -e '/\/$/d' -e '/^PKG-INFO$/d' -e '/^$/d' \
            | sort -u > packaged.txt
          git ls-files | sort -u > tracked.txt
          if comm -23 packaged.txt tracked.txt | grep .; then
            echo "::error::the sdist carries files this commit does not track"
            exit 1
          fi
      - run: uvx twine check dist/*

  # The self-grids: the output formats and the quickstart, witnessed.
  grids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      - run: uv run --locked witnessed verify grids/
