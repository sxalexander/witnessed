name: Close unapproved issues

# An issue not labelled `approved` 30 days after its last activity is closed as
# not planned (CONTRIBUTING.md). A warning is posted 7 days before, and any
# activity in between resets the clock. Pull requests are never touched.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 23
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-issue-labels: approved,upstream-break
          stale-issue-label: unapproved
          close-issue-reason: not_planned
          stale-issue-message: >
            This issue has not been approved and will be closed as not planned in
            7 days. Any comment resets the clock. See CONTRIBUTING.md.
          close-issue-message: >
            Closed as not planned: not approved within 30 days. This holds the
            scope boundary in README.md and is not a judgement of the idea.
