[project]
name = "witnessed"
version = "0.1.0"
description = "Witness grids whose cells are proven by a verifier that ran or closed with a stated reason"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0.2",
    "pytest>=8.4",
]

[project.scripts]
witnessed = "witnessed.cli:main"

# There is deliberately no [project.entry-points.pytest11]. The plugin is inert
# unless enabled: a project's own `pytest` invocation must never collect grids,
# run a grid's setup, or spawn a verifier. It is loaded with `-p witnessed.plugin`.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witnessed"]

# The sdist names what it carries rather than what it omits. hatchling's default
# is every file git does not ignore, and a path excluded locally through
# .git/info/exclude is not ignored: a build from a working tree would ship
# whatever sits beside the source, which is not what the tagged commit holds.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "grids",
    ".fixtures",
    ".witnessed/runs.json",
    "pyproject.toml",
    "uv.lock",
    "README.md",
    "QUICKSTART.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
]

[tool.pytest.ini_options]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
